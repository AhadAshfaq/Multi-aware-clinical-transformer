# General Cancer (GC) self-supervised pretraining configuration.
#
# Workflow:
#   1. Construct the patient-excluded GC cohort from authorized MIMIC-IV data.
#   2. Generate GC-only pretraining tensors and event-position masks.
#   3. Pretrain the EMIT-based model on GC.
#   4. Use the saved GC checkpoint to initialize AP/NF fine-tuning folds.
#
# All paths reference restricted MIMIC-IV-derived files and must be supplied locally by credentialed users. Do not commit data, checkpoints, or results.

cohort_name: GC
seed: 2021

# Observation-window and pretraining-objective settings.
# False: full 14-day observation window [0, 336] hours.
# True: last-7-day observation window [168, 336] hours.
USE_7_DAY_WINDOW: false

# False: Pure MAE with zero-filled forecasting targets.
# True: Hybrid reconstruction--forecasting pretraining, where (312, 336]
# hours form the forecasting target window.
USE_FORECASTING_ABLATION: false

# Target-Mask Alignment mode.
# Options: val_var_time, val_var, var_time, val_time, val, var, time.
target_mode: val_var_time

# Reconstruction-loss mode.
# Options: 'standard', 'proportional_frequency', 'inverse_frequency', 'temporal_weighted', 'relative_temporal', 'clinical_regularized' 
loss_type: inverse_frequency

# Event-position masking strategy.
# Options: rate_of_change, random, clinical, frequency, temporal.
masking_strategy: rate_of_change

# Masking probabilities.
random_mask_prob: 0.50            # Random Mode: chance to hide ANY event
pathological_mask_prob: 0.60      # Clinical Mode: chance to hide out-of-bounds events
normal_mask_prob: 0.40            # Clinical Mode: chance to hide stable/normal events
rare_mask_prob: 0.60              # Frequency Mode: chance to hide the rarest events
common_mask_prob: 0.40            # Frequency Mode: chance to hide the most common events
recent_mask_prob: 0.60            # Temporal Mode: chance to hide pre-crash events (Time 1.0)
old_mask_prob: 0.40               # Temporal Mode: chance to hide baseline events (Time 0.0)


# Rate-of-Change masking parameters.
# Events with |delta value / delta time| > mask_threshold receive masking
# probability 1 - insignificant_prob; all other observed events receive
# insignificant_prob.
mask_threshold: 0.001
insignificant_prob: 0.40

# Frequency-weight files are used only for inverse_frequency or proportional_frequency GC reconstruction-loss experiments.
# When "run_master_pipeline.sh" is used, leave both paths null. For a frequency loss, the script pretrains GC twice: 
# it passes AP-derived weights to the checkpoint used for AP fine-tuning, and NF-derived weights to the checkpoint
# used for NF fine-tuning. These command-line overrides do not modify this YAML.
# If pretrain_chemo.py is run directly instead, supply the appropriate AP or NF weight-file path explicitly for the selected loss type.

inverse_frequency_weights_path: null
proportional_frequency_weights_path: null

# Restricted local input files generated by the GC formatter.
data_path: data/pre_training/pretraining_data_chemo_GC.npz
mask_path: data/pre_training/chemo_GC_event_masks.npz

# Architecture.
max_len: 1035           # Kept at 1035 to ensure the  sequence length is large enough to handle both NF and AP later
V: 102                  # The Top 100 most frequent clinical features + 2 Demographics = 102               
d: 128                  # Dimension of the embeddings.
N: 2                    # Number of transformer encoder blocks in the model.
he: 8                   # Number of attention heads in the model's multi-head attention mechanism.
dropout: 0.2            # Neural Network Regularization parameters to prevent overfitting

# Optimization.
batch_size: 32              # Batch size for training during pretraining.
learning_rate: 0.0005       # Learning rate for the pretraining process
weight_decay: 0.0           # Weight decay coefficient for L2 regularization.
epochs: 100                 # Number of training epochs for pretraining
patience: 10                # If the Validation Loss doesn't improve for "10" consecutive epochs, stop training immediately.
error_coefficient: 8        # Coefficient used for weighing the error from the masked events during pretraining.

# Number of samples to be processed per epoch during pretraining.
samples_per_epoch: 3200

# Restricted local checkpoint output.
model_name: pretrained_models/Chemo/EMIT_MAE/GC/EMIT_Chemo_GC_128d

hydra:
  run:
    dir: logs/hydra_logs/Chemo_GC/PT/${now:%Y-%m-%d_%H-%M-%S}